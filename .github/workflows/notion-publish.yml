name: Notion publish
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Post to LinkedIn even outside the time window'
        required: false
        default: 'false'
  repository_dispatch:
    types: [notion-approved]
  deployment_status:

concurrency:
  group: notion-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Pull approved pages from Notion
        run: node scripts/notion-sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SITE_URL: https://tibinjacob.com
      - name: Detect changes
        id: diff
        run: |
          mkdir -p src/page-content public/content-images
          git add -A src/content src/page-content public/content-images || true
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build check before publishing
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build
        env:
          SITE_URL: https://tibinjacob.com
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Tibin Jacob"
          git config user.email "digitalexpert.client@gmail.com"
          git commit -m "content: publish approved Notion pages"
          git push origin HEAD:main

  post-deploy:
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Mark live + LinkedIn + first comment + internal links
        run: node scripts/post-deploy.mjs
        env:
          NOTION_TOKEN:             ${{ secrets.NOTION_TOKEN }}
          SITE_URL:                 https://tibinjacob.com
          GITHUB_SHA:               ${{ github.sha }}
          GITHUB_REPOSITORY:        ${{ github.repository }}
          COMPOSIO_API_KEY:         ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_LINKEDIN_ACCOUNT: ${{ secrets.COMPOSIO_LINKEDIN_ACCOUNT }}
          LINKEDIN_ACCESS_TOKEN:    ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:      ${{ secrets.LINKEDIN_AUTHOR_URN }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:             ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          XAI_API_KEY:              ${{ secrets.XAI_API_KEY }}
          INDEXNOW_KEY:             ${{ secrets.INDEXNOW_KEY }}
          FORCE_POST:               ${{ github.event.inputs.force_post || 'false' }}
